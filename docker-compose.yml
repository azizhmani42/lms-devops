services:
  mysqldb:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=lms
    ports:
      - "3306:3306"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  lms-backend:
    depends_on:
      mysqldb:
        condition: service_healthy
    image: azizhmani20/lms-backend:1.0.0
    restart: on-failure
    ports:
      - "8082:8080"
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url": "jdbc:mysql://mysqldb:3306/lms?createDatabaseIfNotExist=true",
        "spring.datasource.username": "root",
        "spring.datasource.password": "root",
        "spring.jpa.hibernate.ddl-auto": "update"
      }'

  lms-frontend:
    depends_on:
      - lms-backend
    image: azizhmani20/lms-frontend:1.0.0
    restart: on-failure
    ports:
      - "4200:80"

volumes:
  db:
